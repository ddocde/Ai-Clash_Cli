name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  archive:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, tomllib
          with open('Cargo.toml', 'rb') as f:
              version = tomllib.load(f)['workspace']['package']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag and Cargo version differ'
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Bundle verified default engine and upstream source
        run: python scripts/bundle_core.py --arch ${{ matrix.arch }} --output dist/package
      - name: Test bundled installation and real engine
        env:
          CLASH_CLI_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/clash-cli
        run: |
          cp target/${{ matrix.target }}/release/clash-cli dist/package/
          dist/package/clash-cli --data-dir "$RUNNER_TEMP/offline-core" core install --json
          python scripts/smoke_real_core.py "$RUNNER_TEMP/offline-core/mihomo"
      - name: Package CLI and notices
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cp LICENSE THIRD_PARTY.md CONTRIBUTING.md README.md README.zh-CN.md CHANGELOG.md dist/package/
          cp -r skills docs dist/package/
          tar -czf "dist/clash-cli-${GITHUB_REF_NAME}-linux-${ARCH}.tar.gz" -C dist/package .
      - uses: actions/upload-artifact@v4
        with:
          name: clash-cli-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: archive
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: clash-cli-linux-*
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cd ..
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --verify-tag --prerelease --title "${GITHUB_REF_NAME} — Linux preview" --notes-file docs/releases/preview.md
          fi
