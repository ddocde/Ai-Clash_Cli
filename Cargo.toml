[workspace]
members = ["crates/*"]
resolver = "2"
[workspace.package]
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/ddocde/Ai-Clash_Cli"
homepage = "https://github.com/ddocde/Ai-Clash_Cli#readme"
[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

tokio = { version = "1.48", features = ["full"] }
uuid = { version = "1.18", features = ["v4"] }
tempfile = "3.23"
fs2 = "0.4"

base64 = "0.22"
url = "2.5"
percent-encoding = "2.3"
flate2 = "1.1"
sha2 = "0.10"

thiserror = "2.0"
